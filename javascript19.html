<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>JavaScript While Loops</title>
</head>
<body>
    <script>
        // --- EXAMPLE 1: Forced Name Entry ---
        let username = "";

        // Repeat prompt while username is empty OR null (Cancel button)
        while (username === "" || username === null) {
            username = window.prompt("Enter your name");
        }

        console.log(`Hello ${username}`);

        // --- EXAMPLE 2: Login System ---
        let loggedIn = false;
        let user;
        let pass;

        // Use a do-while to ensure the prompt runs at least once 
        do {
            user = window.prompt("Enter your username");
            pass = window.prompt("Enter your password");

            if (user === "myUsername" && pass === "myPassword") {
                loggedIn = true;
                console.log("You are logged in!");
            } else {
                console.log("Invalid credentials! Please try again.");
            }
        } while (!loggedIn);

    </script>
</body>
</html>
