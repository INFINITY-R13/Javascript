<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>JavaScript Rest Parameters</title>
</head>
<body>
    <script>
        // --- EXAMPLE 1: Bundling Elements ---
        function openFridge(...foods) {
            console.log("Fridge contains:", foods);
        }

        const food1 = "pizza";
        const food2 = "hamburger";
        const food3 = "hot dog";
        const food4 = "sushi";

        openFridge(food1, food2, food3, food4, "ramen");


        // --- EXAMPLE 2: Math Operations (Sum & Average) ---
        function sum(...numbers) {
            let result = 0;
            for (let number of numbers) {
                result += number;
            }
            return result;
        }

        function getAverage(...numbers) {
            let result = 0;
            for (let number of numbers) {
                result += number;
            }
            return result / numbers.length;
        }

        const total = sum(1, 2, 3, 4, 5);
        const average = getAverage(75, 100, 85, 90, 50);

        console.log(`Total: $${total}`);       // 15
        console.log(`Average score: ${average}`); // 80


        // --- EXAMPLE 3: String Combining ---
        function combineStrings(...strings) {
            return strings.join(" ");
        }

        const fullName = combineStrings("Mr.", "SpongeBob", "SquarePants", "III");
        console.log("Full Name:", fullName);

    </script>
</body>
</html>
