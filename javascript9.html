<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Random Number Generator</title>
    <style>
        /* CSS Styling */
        body {
            font-family: verdana;
            text-align: center;
        }
        #myButton {
            font-size: 3em;
            padding: 5px 25px;
            border-radius: 5px;
            cursor: pointer;
        }
        .myLabels {
            font-size: 3em;
            display: block; /* Ensures each label is on a new line */
        }
    </style>
</head>
<body>

    <button id="myButton">Roll</button><br>
    <label id="label1" class="myLabels"></label>
    <label id="label2" class="myLabels"></label>
    <label id="label3" class="myLabels"></label>

    <script>
        /* JavaScript Logic */
        const myButton = document.getElementById("myButton");
        const label1 = document.getElementById("label1");
        const label2 = document.getElementById("label2");
        const label3 = document.getElementById("label3");

        const min = 1;
        const max = 6;
        let randomNum1;
        let randomNum2;
        let randomNum3;

        myButton.onclick = function() {
            // Calculate 3 random numbers 
            randomNum1 = Math.floor(Math.random() * max) + min;
            randomNum2 = Math.floor(Math.random() * max) + min;
            randomNum3 = Math.floor(Math.random() * max) + min;

            // Display results in labels
            label1.textContent = randomNum1;
            label2.textContent = randomNum2;
            label3.textContent = randomNum3;
        }
    </script>

</body>
</html>
