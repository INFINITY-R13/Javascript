<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>JavaScript Method Chaining</title>
</head>
<body>
    <script>
        // --- THE LONG WAY (No Method Chaining) ---
        /*
        let username = window.prompt("Enter your username:");

        username = username.trim();
        let letter = username.charAt(0);
        letter = letter.toUpperCase();

        let extraChars = username.slice(1);
        extraChars = extraChars.toLowerCase();

        username = letter + extraChars;
        console.log("Long way result:", username);
        */

        // --- THE METHOD CHAINING WAY ---
        let username = window.prompt("Enter your username:");

        // Format: Trim -> First Char -> UpperCase + Trim -> Slice -> LowerCase
        username = username.trim().charAt(0).toUpperCase() + 
                   username.trim().slice(1).toLowerCase();

        console.log("Method chaining result:", username);

    </script>
</body>
</html>
