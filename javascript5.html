<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>JavaScript Type Conversion</title>
</head>
<body>

    <script>
        // --- EXAMPLE 1: Converting User Input ---
        /*
        let age = window.prompt("How old are you?");
        
        // Convert the string input to a number
        age = Number(age); 
        age += 1;

        console.log(age, typeof age); // Results in 26 "number"
        */

        // --- EXAMPLE 2: Testing Different Types ---
        let x = "pizza";
        let y = "pizza";
        let z = "pizza";

        x = Number(x);   // Becomes NaN (Not a Number)
        y = String(y);   // Stays "pizza"
        z = Boolean(z);  // Becomes true

        console.log(x, typeof x);
        console.log(y, typeof y);
        console.log(z, typeof z);

        // --- EXAMPLE 3: Empty Values ---
        let a = "";
        let b = "";
        let c = "";

        a = Number(a);   // Becomes 0
        b = String(b);   // Stays ""
        c = Boolean(c);  // Becomes false (useful for validation)

        console.log(a, typeof a);
        console.log(b, typeof b);
        console.log(c, typeof c);
    </script>

</body>
</html>
