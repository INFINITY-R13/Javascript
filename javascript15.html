<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>JavaScript String Slicing</title>
</head>
<body>
    <script>
        // --- EXAMPLE 1: Basic Slicing ---
        const fullName = "Bro Code";

        let firstName = fullName.slice(0, 3); // Extracts "Bro"
        let lastName = fullName.slice(4, 8);  // Extracts "Code"

        console.log("First Name (static):", firstName);
        console.log("Last Name (static):", lastName);

        // --- EXAMPLE 2: Negative Indices ---
        let firstChar = fullName.slice(0, 1);   // "B"
        let lastChar = fullName.slice(-1);      // "e"
        console.log("First Char:", firstChar);
        console.log("Last Char:", lastChar);

        // --- EXAMPLE 3: Dynamic Slicing (Name) ---
        const dynamicName = "Broseph Code";

        // Find space and slice up to it
        let dynamicFirst = dynamicName.slice(0, dynamicName.indexOf(" "));
        // Slice starting from character after the space
        let dynamicLast = dynamicName.slice(dynamicName.indexOf(" ") + 1);

        console.log("Dynamic First Name:", dynamicFirst);
        console.log("Dynamic Last Name:", dynamicLast);

        // --- EXAMPLE 4: Dynamic Slicing (Email) ---
        const email = "Bro1@gmail.com";

        let username = email.slice(0, email.indexOf("@"));
        let extension = email.slice(email.indexOf("@") + 1);

        console.log("Username:", username);   // Bro1
        console.log("Extension:", extension); // gmail.com

    </script>
</body>
</html>
